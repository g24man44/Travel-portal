name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write the app
        run: |
          mkdir -p app/src/main/java/com/awardtrip/desk app/src/main/res/mipmap-anydpi-v26 app/src/main/res/drawable app/src/main/res/values
          cd app
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'AwardTripDesk'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'com.awardtrip.desk'
            compileSdk 34
            defaultConfig {
              applicationId 'com.awardtrip.desk'
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF
          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <queries>
              <package android:name="com.prioritypass3"/>
              <package android:name="com.google.android.apps.walletnfcrel"/>
              <package android:name="com.samsung.android.spay"/>
              <package android:name="com.konylabs.capitalone"/>
              <package android:name="com.chase.sig.android"/>
              <package android:name="com.americanexpress.android.acctsvcs.us"/>
              <package android:name="com.android.vending"/>
              <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
            </queries>
            <application
              android:label="Award Trip Desk"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.Material.NoActionBar"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="navy">#0D1B2E</color></resources>
          EOF
          cat > src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <group android:translateX="30" android:translateY="30">
              <path android:fillColor="#D9B36A" android:pathData="M45,31.5v-4L29,17.5V7a3,3 0,0 0,-6 0v10.5L7,27.5v4l16,-5v10l-4,3v3l7,-2 7,2v-3l-4,-3v-10z"/>
            </group>
          </vector>
          EOF
          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/navy"/>
            <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF
          cat > src/main/java/com/awardtrip/desk/MainActivity.java <<'EOF'
          package com.awardtrip.desk;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            static final String HOME = "https://awardtrip.pages.dev/";
            static final String HOST = "awardtrip.pages.dev";
            static final int REQ_FILE = 2, REQ_GEO = 1;
            WebView web;
            ValueCallback<Uri[]> fileCb;
            GeolocationPermissions.Callback geoCb;
            String geoOrigin;

            @Override
            protected void onCreate(Bundle saved) {
              super.onCreate(saved);
              getWindow().setStatusBarColor(Color.parseColor("#0D1B2E"));
              web = new WebView(this);
              web.setBackgroundColor(Color.parseColor("#0D1B2E"));
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setGeolocationEnabled(true);
              s.setUserAgentString(s.getUserAgentString() + " AwardTripApp/1");
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  return handle(r.getUrl());
                }
              });
              web.setWebChromeClient(new WebChromeClient() {
                @Override
                public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                  if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                    cb.invoke(origin, true, false);
                  } else {
                    geoCb = cb;
                    geoOrigin = origin;
                    requestPermissions(new String[]{Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.ACCESS_FINE_LOCATION}, REQ_GEO);
                  }
                }
                @Override
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try {
                    startActivityForResult(p.createIntent(), REQ_FILE);
                  } catch (ActivityNotFoundException e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
              });
              if (saved != null) web.restoreState(saved);
              else web.loadUrl(HOME);
            }

            // Opens other apps by name: atd://open?pkg=com.prioritypass3,another.package
            boolean openApp(String pkgs) {
              PackageManager pm = getPackageManager();
              String first = null;
              for (String p : pkgs.split(",")) {
                p = p.trim();
                if (p.isEmpty()) continue;
                if (first == null) first = p;
                Intent i = pm.getLaunchIntentForPackage(p);
                if (i != null) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(i);
                  return true;
                }
              }
              if (first != null) external(Uri.parse("https://play.google.com/store/apps/details?id=" + first));
              return true;
            }

            void external(Uri u) {
              try {
                startActivity(new Intent(Intent.ACTION_VIEW, u));
              } catch (ActivityNotFoundException e) {
                // nothing can open it
              }
            }

            boolean handle(Uri u) {
              String scheme = u.getScheme() == null ? "" : u.getScheme();
              if (scheme.equals("atd") && "open".equals(u.getHost())) {
                String pkg = u.getQueryParameter("pkg");
                return pkg == null || openApp(pkg);
              }
              if (scheme.equals("intent")) {
                try {
                  Intent i = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                  if (i.getPackage() != null && getPackageManager().getLaunchIntentForPackage(i.getPackage()) != null) {
                    return openApp(i.getPackage());
                  }
                  String fb = i.getStringExtra("browser_fallback_url");
                  if (fb != null) web.loadUrl(fb);
                } catch (Exception e) {
                  // ignore bad links
                }
                return true;
              }
              if (scheme.equals("http") || scheme.equals("https")) {
                String h = u.getHost() == null ? "" : u.getHost();
                if (h.equals(HOST) || h.endsWith("." + HOST)) return false;
                external(u);
                return true;
              }
              external(u);
              return true;
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_FILE && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
              }
            }

            @Override
            public void onRequestPermissionsResult(int req, String[] perms, int[] results) {
              super.onRequestPermissionsResult(req, perms, results);
              if (req == REQ_GEO && geoCb != null) {
                boolean ok = results.length > 0 && results[0] == PackageManager.PERMISSION_GRANTED;
                geoCb.invoke(geoOrigin, ok, false);
                geoCb = null;
              }
            }

            @Override
            protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              web.saveState(out);
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack();
              else super.onBackPressed();
            }
          }
          EOF

      - name: Build
        working-directory: app
        run: gradle assembleDebug --no-daemon --stacktrace && ls build/outputs/apk/debug && cp build/outputs/apk/debug/*.apk ../AwardTripDesk.apk

      - name: Publish the app file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Award Trip Desk app
          body: Tap AwardTripDesk.apk below to download and install the Android app.
          files: AwardTripDesk.apk
          make_latest: true
