<script>
const LB={1:'A',11:'J',12:'Q',13:'K',0:'Joker'},lab=r=>LB[r]||String(r),isW=c=>c.r===10&&!(typeof V!=='undefined'&&V&&V.tenUsed);
const SU=['♠','♥','♦','♣'],RED=[0,1,1,0];
const PIPS={2:[[1,0],[1,6]],3:[[1,0],[1,3],[1,6]],4:[[0,0],[2,0],[0,6],[2,6]],5:[[0,0],[2,0],[1,3],[0,6],[2,6]],6:[[0,0],[2,0],[0,3],[2,3],[0,6],[2,6]],7:[[0,0],[2,0],[1,1.5],[0,3],[2,3],[0,6],[2,6]],8:[[0,0],[2,0],[1,1.5],[0,3],[2,3],[1,4.5],[0,6],[2,6]],9:[[0,0],[2,0],[0,2],[2,2],[1,3],[0,4],[2,4],[0,6],[2,6]],10:[[0,0],[2,0],[1,1],[0,2],[2,2],[0,4],[2,4],[1,5],[0,6],[2,6]]};
function fsvg(c){
  const F="Fraunces,Georgia,'Times New Roman',serif";
  const o=`<svg viewBox="0 0 50 70" xmlns="http://www.w3.org/2000/svg" font-family="${F}"><defs><linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f6eedb"/></linearGradient></defs><rect width="50" height="70" fill="url(#iv)"/>`;
  if(c.r===0){const k='#7a3cc8',cr=`<text x="7" y="13" font-size="9" text-anchor="middle" fill="${k}">★</text>`;
    return o+`<rect x="1.5" y="1.5" width="47" height="67" rx="4" fill="none" stroke="#e0a82e" stroke-width="2"/>${cr}<g transform="rotate(180 25 35)">${cr}</g><text x="25" y="42" font-size="30" text-anchor="middle" fill="${k}">★</text></svg>`}
  const BG=document.documentElement.classList.contains('big'),r=c.r,col=BG?['#111111','#d0021b','#0b57d0','#13803a'][c.s]:RED[c.s]?'#b5172b':'#1d1f2b',L=lab(r),g=SU[c.s];
  const cn=BG?`<text x="7.2" y="13.6" font-size="${L.length>1?10.2:13}" font-weight="900" text-anchor="middle" fill="${col}" letter-spacing="-.8">${L}</text><text x="7" y="23" font-size="10" text-anchor="middle" fill="${col}">${g}</text>`:`<text x="6.6" y="12.2" font-size="${L.length>1?8.4:10.5}" font-weight="800" text-anchor="middle" fill="${col}" letter-spacing="-.6">${L}</text><text x="6.6" y="20.4" font-size="8.5" text-anchor="middle" fill="${col}">${g}</text>`;
  let m='';
  if(r===1)m=`<text x="25" y="44.5" font-size="34" text-anchor="middle" fill="${col}">${g}</text><circle cx="25" cy="35" r="15.5" fill="none" stroke="${col}" stroke-opacity=".18" stroke-width=".6"/>`;
  else if(r>10){
    const half=`<text x="25" y="31.8" font-size="13.5" font-weight="800" text-anchor="middle" fill="${col}">${L}</text><text x="18.2" y="25.5" font-size="5.6" text-anchor="middle" fill="${col}">${g}</text><text x="31.8" y="25.5" font-size="5.6" text-anchor="middle" fill="${col}">${g}</text>${r===13?`<path d="M19.5 15.2l2 3 3.5-3.4 3.5 3.4 2-3-.9 4.4h-9.2z" fill="#c9973f"/>`:r===12?`<path d="M20.5 18.6l1.5-3.2 3 2.2 3-2.2 1.5 3.2z" fill="#c9973f"/><circle cx="25" cy="14.8" r="1.1" fill="#c9973f"/>`:`<path d="M21 18.6q4-5 8 0" fill="none" stroke="#c9973f" stroke-width="1.3"/>`}`;
    m=`<rect x="12.5" y="12.5" width="25" height="45" rx="2.5" fill="${col}" fill-opacity=".06" stroke="${col}" stroke-opacity=".55" stroke-width=".7"/><rect x="14" y="14" width="22" height="42" rx="1.6" fill="none" stroke="#c9973f" stroke-width=".5"/><line x1="14" y1="35" x2="36" y2="35" stroke="${col}" stroke-opacity=".35" stroke-width=".5"/>${half}<g transform="rotate(180 25 35)">${half}</g>`}
  else m=PIPS[r].map(([x,y])=>{const cx=17+x*8,cy=18+y*5.7;return`<text x="${cx}" y="${cy+4}" font-size="11.5" text-anchor="middle" fill="${col}"${y>3?` transform="rotate(180 ${cx} ${cy})"`:''}>${g}</text>`}).join('');
  const wild=r===10&&(c.w||isW(c));

const THEMES={auto:'Auto (by season)',classic:'Classic',hw:'Halloween 🎃',fall:'Autumn 🍂',win:'Winter ❄️',val:"Valentine's 💕"};
function seasonTheme(d=new Date()){const m=d.getMonth(),dd=d.getDate();if(m===9)return 'hw';if(m===10)return 'fall';if(m===11||(m===0&&dd<=6))return 'win';if(m===1&&dd<=14)return 'val';return 'classic'}
function themePick(){let t='';try{t=ls.theme||''}catch(e){}return THEMES[t]?t:'auto'}
function themeName(){const t=themePick();return t==='auto'?seasonTheme():t}

  hw:'<span style="top:12%;animation-duration:26s">🦇</span><span style="top:34%;animation-duration:34s;animation-delay:-12s;font-size:16px">🦇</span><span style="top:70%;animation-duration:41s;animation-delay:-25s">🦇</span><span class="gh" style="left:6%;top:52%">👻</span><span class="gh" style="right:8%;top:84%;animation-delay:-4s;font-size:24px">🕸️</span>',

    <button data-a="tut">Start the guided tutorial</button>
    <h2>The goal</h2><p>Be the first to get rid of all your cards. Cards in your hand, your face-up cards and your face-down cards all have to go.</p>
    <h2>Setup</h2><p>2 to 8 players (2 is a head-to-head 1v1). Each player gets 19 cards: 4 face-down, 4 face-up on top of them, and 11 in hand. The highest card flipped at the start goes first (ties flip again), and each round's winner starts the next round.</p>
    <h2>Playing cards</h2><p>On your turn, play a card equal to or lower than the top card of the pile. Aces are lowest and Kings are highest. If the pile is empty, any card is fine. You can play several cards of the same rank together. Cards in your hand, your face-up cards and your unlocked face-down cards can be played in any order.</p>
    <h2>Face-down cards</h2><p>A face-down card unlocks when the face-up card on top of it is gone. Flip it any time it is unlocked. If it is legal it is played, and you can add more cards of the same rank from your hand or face-up cards, then tap Done. If the flip completes four of a kind, you can still add your other cards of that rank so they go out with the pile, or tap Done. Either way the pile clears and you go again. If it is too high, you pick up cards as described below, and you can still add matching cards.</p>
    <h2>10s are wild</h2><p>A 10 clears the pile and you go again. You only get one 10 per turn: once you've played a 10, you can't play another 10 that turn, even if you made other plays in between. A blind face-down 10 always counts. This holds even if 10s are all you have left: you play one, and your turn ends. A blind face-down 10 is the only exception: those always count, even several in one turn.</p>
    <h2>Four of a kind</h2><p>When four cards of the same rank are in the pile (they don't have to be on top), they clear the pile and you go again.</p>
    <h2>Playing too high</h2><p>If you play a card higher than the top card, it stays on the pile and you pick up the other cards in the pile, except cards of the same rank. Then the turn passes. If your play completes four of a kind it still clears, and you pick up the other cards. If your cards were legal, you never pick anything up.</p>
    <h2>Scoring</h2><p>The first player out scores 0. Everyone else adds up the cards they were still holding: a 10 is 15 points, J/Q/K are 10 each, 2 to 9 are their number, and an Ace is 1. When anyone's total reaches 150 the game ends, and the lowest total wins.</p>
    <h2>Move limit</h2><p>If a hand reaches 250 moves without anyone going out (it can happen in a 1v1 when the 10s run out), it ends right there. The player holding the fewest points wins the hand and scores 0; everyone else scores what they hold.</p>
    <h1 style="font-size:24px;margin-top:18px">Extras</h1>
    <h2>🗓️ Daily challenge</h2><p>Sign in, tap <b>Daily challenge</b> on the home screen, then <b>Play today's deal</b>. You play one hand against Ella and Findley, and everyone gets exactly the same cards that day. Lowest points wins and going out scores 0. You get one try per day; tap <b>See today's results</b> afterwards to compare with everyone else.</p>
    <h2>🧠 Greg ladder</h2><p>Greg has 5 levels: Rookie, Shark, Pro, Master and Legend. Rookie makes plenty of mistakes and each level makes fewer. Master and Legend play every move at full strength, and Legend thinks the longest. Greg sees everyone's cards when he plans his moves. Up to Master he gets a fair, shuffled deal, just like you; Legend, the final boss, also gets a small edge in his deal. Token swaps are turned off against Master and Legend. Everyone starts with Rookie. To climb: tap <b>🧠 Greg ladder</b> on the home screen (or <b>Challenge Greg now</b> on your profile). That makes a game with Greg already in it at your highest unlocked level. Tap <b>Start 1v1 game</b>, or invite friends first if you want company. Win the full game (lowest total when someone reaches 150) to open the next level. You can also add Greg to any game with <b>Add computer player</b>. Your profile shows how far you've climbed.</p>
    <h2>🏆 Tournaments</h2><p>Tap <b>Tournaments</b> on the home screen. One person creates it and shares the 5-letter code; everyone else enters the code to join. When 3 to 16 players are in, the host taps <b>Start the tournament</b>. Players are split into tables of 3 or 4, each table plays a quick game, and the winners meet at the final table. Tap your table to play. If you don't show up, the computer plays for you. The champion gets a trophy on their profile.</p>
    <h2>🤝 2v2 partners</h2><p>With exactly 4 players, the host can turn on <b>Teams: 2v2 partners</b> in the lobby (and tap <b>Change partners</b> to pick who's with who). Partners sit across from each other, so turns alternate between the teams. Your partner's tile glows green. Points from both partners are added together, and the lowest team total wins once a team reaches double the game target. Tap 🤝 next to the Play button to send your partner a quick signal only they can see.</p>
    <h2>📳 Vibration and 🔍 Big cards</h2><p>Both are in Settings: the ⚙️ at the top of the home screen, or Settings during a game. Vibration buzzes your phone when it's your turn, when the pile is cleared, on a big pickup and when you go out. Big cards makes the cards larger and uses four suit colors (♠ black, ♥ red, ♦ blue, ♣ green) so they're easier to read.</p>
    <h2>🐢 Slow games</h2><p>In the lobby, the host turns on <b>Slow game</b> before starting. Everyone can take their turn whenever they like, even hours later. Your games show under <b>My slow games</b> on the home screen, and you'll get a notification when it's your turn.</p>
    <h2>🎓 Coach</h2><p>After each hand, if one of your moves cost you noticeably, the score screen shows it along with what Greg would have played.</p>
    <h2>🔔 Notifications</h2><p>Open your profile and turn on <b>Notifications</b> to hear about your turn in slow games, friend invites and tournaments. On iPhone, install the app to your home screen first.</p>
    <h2 id="tkhow">🪙 Tokens and card swaps</h2><p>You earn tokens by playing: +10 for finishing a game, +25 more for winning, +15 for the daily challenge and +20 for each new badge. Everyone starts with 100. In games against computers only (including the Greg ladder), select the card you want to get rid of from your hand or face-up cards and tap 🪙. You'll see 3 different cards from the unused deck and pick the one you want (or cancel, and nothing is spent). A swap costs 100 tokens, you get one per hand, and it doesn't end your turn. Swaps aren't available in games with other people, the daily challenge, tournaments, or against Greg on Master or Legend.</p>
    <h2>📺 Party mode</h2><p>Game night on the big screen: in the lobby tap <b>📺 TV</b>, then open <b>this site's address + /tv</b> on a TV or laptop and type the game code. The big screen shows the table, the pile and everyone's face-up cards. Everyone still plays their own hand on their phone.</p>
    <h2>👻 Ghost players</h2><p>The game learns how you and your friends play. Once a friend has played a few hands, the host can add their ghost from <b>Add computer player</b>: a computer that plays in their style.</p>
    <h2>🔮 Predictions</h2><p>Watching a friend's game? Bet 20 tokens on who'll win before the end of hand 2. Get it right and you win 2 to 4 times your stake, depending on how many players there are.</p>
    <h2>🎯 Weekly missions</h2><p>Every Monday everyone gets the same three missions, like "Win 2 games" or "Clear the pile with four of a kind 3 times." Finish one and you earn tokens. Your progress is on the home screen under This week.</p>
    <h2>🎃 Monthly card backs</h2><p>Each month has a limited card back you can only earn that month, like the Haunted back in October. Reach the goal shown under This week, then equip it on your profile. Everyone sees it on your face-down cards.</p>
    <h2>⚡ Play someone now</h2><p>Tap ⚡ on the home screen to be matched with anyone else who's searching. It's a ranked 1v1 with quick hands, game to 100. Winning raises your rating (everyone starts at 1000); losing lowers it. Beating someone rated higher is worth more.</p>
    <h2>🏅 Ranked tiers</h2><p>After 3 ranked matches you get a rank from your rating: 🥉 Bronze, 🥈 Silver (950+), 🥇 Gold (1050+), 💠 Platinum (1150+), 💎 Diamond (1250+) and 🐉 Greg Slayer (1350+). Your rank shows next to your name everywhere. At the start of each month ratings move halfway back toward 1000 and everyone plays 3 new placement matches.</p>
    <h2>🪙 Token stakes</h2><p>In a 1v1 lobby with two people (no computer players), the host can pick stakes: 25, 50, 100 or 250 tokens each. The other player taps <b>Accept</b>, and the tokens come out of both accounts when the game starts. The winner takes the whole pot. A tie gives everyone their stake back. Leave mid-game and you forfeit the pot to your opponent.</p>
    <h2>🎄 Christmas Greg quiz</h2><p>From December 1 to 25, a home-screen card asks one question about Greg each day. Get it right for 🪙 +25 tokens. Get it wrong and the Grinch steals 🪙 50 (he can't take you below 0). One try per day.</p>
    <h2>💰 The Grinch's stash</h2><p>Every token the Grinch steals goes into his stash. Once a day (December 1 to 25), wager any amount up to what's in the stash (and what you have). You get one hard question about Greg. Answer right and you win your wager from the stash; it's yours and nobody else can win it. Answer wrong and your wager goes into the stash. Whatever isn't won carries over to the next day.</p>
    <h2>🏈 Football card backs</h2><p>Open your profile and tap <b>Football card backs</b>. There's one for every NFL team, with its logo and colors, 2,000 tokens each. Buy one and it's equipped right away; switch any time from your profile.</p>
    <h2>🎁 10 Wrapped</h2><p>From December 1 to January 15, tap <b>Your year in 10</b> on the home screen to see your year: games and wins, your most-played card, piles cleared, your rival and your record against Greg. Tap <b>Share my year</b> to send a picture of it.</p>
    <h2>🎓 Guided first game</h2><p>New players see a guided game on the home screen: a short hand against two easy computer players with a coach. Finish it for 🪙 +50 bonus tokens (one time). You can replay it any time from the button at the top of How to play.</p>
    <h2>🔥 Daily streak</h2><p>Finish at least one hand every day to build a streak. Bonus tokens at 3 days (+20), 7 days (+50), 14 days (+100) and 30 days (+200), then +200 every 30 days after that. A 🧊 streak freeze costs 75 tokens; if you miss a day, it's used automatically and your streak survives. You can hold 2 at a time. Days run on US Eastern time.</p>
    <h2>⏱ Blitz</h2><p>Turn on Blitz in the lobby's house rules. Every player gets 10 seconds a turn; if time runs out, the computer moves for you. Hands are quick and the next hand deals by itself.</p>
    <h2>😎 Greg's mood</h2><p>Greg remembers how your games against him went. Beat him a few times in a row and he sulks; let him win and he gets cocky. His mood shows next to his name and in the lobby.</p>
    <h2>👥 Friend activity</h2><p>The home screen shows what your friends have been up to: wins, badges, ladder climbs, tournament wins and unlocked card backs.</p>
    <h2>🏅 Show off a badge</h2><p>Open your profile and tap any badge you've earned. It shows next to your name everywhere: friends lists, the lobby, at the table and on the leaderboard. Tap it again to hide it. Tap a friend's name to see all of their badges.</p>
    <h2>🥇 Season trophies</h2><p>The leaderboard resets each month. The top 3 of each month get a trophy on their profile.</p>

  if(V&&!hold&&!winHold&&V.pile>0&&V.phase==='play'&&e.target.closest('.tbl')&&!suppress){view='pile';return render()}

});
$.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-id],[data-m]');if(el){e.preventDefault();el.click()}}});

// drag / throw
$.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-id],[data-m]');
  if(!el||!V||V.phase!=='play'||V.cur!==V.me||e.button>0)return;
  if(el.dataset.m!==undefined&&V.ps[V.me].b[+el.dataset.m])return;
  drag={el,x:e.clientX,y:e.clientY,r:el.getBoundingClientRect(),on:false,id:e.pointerId,ly:e.clientY,lt:performance.now(),vy:0};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){
    if(Math.hypot(dx,dy)<10)return;
    drag.on=true;const r=drag.r;ghost=drag.el.cloneNode(true);ghost.classList.remove('sel','dim','pk');ghost.classList.add('ghost');
    ghost.removeAttribute('data-id');ghost.removeAttribute('data-m');ghost.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    document.body.appendChild(ghost);drag.el.style.opacity='.25';
  }
  const now=performance.now();drag.vy=(e.clientY-drag.ly)/Math.max(1,now-drag.lt);drag.ly=e.clientY;drag.lt=now;
  ghost.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-25,Math.min(25,dx*.08))}deg) scale(1.12)`;
  const t=document.querySelector('.tbl');if(t)t.classList.toggle('drop',e.clientY<t.getBoundingClientRect().bottom-10);
});
function bounce(){
  const g=ghost;ghost=null;if(!g)return;
  g.animate([{transform:g.style.transform},{transform:'none'}],{duration:220,easing:'ease-out'}).onfinish=()=>{g.remove();pend=false;render()};
}
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;const t=document.querySelector('.tbl');if(t)t.classList.remove('drop');
  if(!d.on)return;
  suppress=true;setTimeout(()=>suppress=false,60);
  const tb=t.getBoundingClientRect(),go=e.clientY<tb.bottom-10||(d.vy<-0.7&&e.clientY<d.y-30);
  if(!V||V.cur!==V.me||!go)return bounce();
  const {lg,okSel,pc,av,blk,forced}=ctx();let ids;
  if(d.el.dataset.m!==undefined)ids=['m'+d.el.dataset.m];
  else{const c=av.find(x=>x.id===+d.el.dataset.id);if(!c)return bounce();
    if((V.add!=null&&c.r!==V.add)||blk(c)){bounce();return tooHigh(c)}
    ids=sel.includes(c.id)&&c.r!==10&&sel.every(i=>{const k=av.find(x=>x.id===i);return k&&k.r===c.r})?[...sel]:[c.id];}
  throwFrom=[rectOf(ghost)];throwGhost=ghost;ghost=null;pend=false;
  setTimeout(()=>{if(throwGhost){throwGhost.remove();throwGhost=null;render()}},1500);
  act('play',ids);
});
window.addEventListener('pointercancel',()=>{if(drag&&drag.on)bounce();drag=null});

var WITHL=null;try{const wc=new URLSearchParams(location.search).get('with');if(wc&&/^[A-Z0-9]{4,8}$/i.test(wc)){WITHL=wc.toUpperCase();history.replaceState(null,'',location.pathname)}}catch(e){}
try{const q=new URLSearchParams(location.search),w=q.get('wrap'),g=q.get('grinch');if(w||g){history.replaceState(null,'',location.pathname);const go=(n=0)=>{if(typeof ACC!=='undefined'&&ACC&&tpid){w?openWrap():openGrinch(true,1)}else if(n<60)setTimeout(()=>go(n+1),500)};setTimeout(go,300)}}catch(e){}
var JOINL=null;try{const jc=new URLSearchParams(location.search).get('join');if(jc&&/^[A-Z]{4}$/.test(jc)){JOINL=jc;history.replaceState(null,'',location.pathname)}}catch(e){}

if(SPECL){S.room=SPECL[0];S.pid=SPECL[1];connect()}else if(S.room&&S.pid){const r0=S.room;join(r0).then(()=>{if(!V&&err){S.room='';S.pid='';try{ls.sr='';ls.sp=''}catch(e){}err=/No game/.test(String(err))?'Your last game ended or the server restarted, so it is no longer available.':err;render()}})}else render();

{let nt=null;const nameSeen=e=>{const t=e.target;if(!t||t.id!=='nm'||V||!G.code)return;clearTimeout(nt);nt=setTimeout(()=>{const n=(t.value||'').trim().slice(0,12);if(n.length<1||n===S.name&&pes)return;S.name=n;try{ls.sn=n}catch(x){}presConnect()},e.type==='change'?0:900)};
